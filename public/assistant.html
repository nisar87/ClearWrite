<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>ClearWrite</title>
  <link rel="stylesheet" href="./tokens.css">
  <link rel="stylesheet" href="./panel.css">
  <script defer src="./assistant.js"></script>
</head>
<body class="assistant-page">
  <main class="panel" id="panel" data-status="quiet" aria-labelledby="panel-title">
    <header class="panel-header">
      <div class="panel-brand">
        <span class="brand-mark small" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 11.5l4 4 9-9"/><path d="M5.5 19.5h13" opacity=".55"/></svg></span>
        <div class="panel-titles"><strong id="panel-title">ClearWrite</strong><span id="panel-context">Live writing</span></div>
      </div>
      <div class="panel-tools">
        <button class="icon-button" id="pin-button" type="button" aria-pressed="true" title="Keep on top of other windows" aria-label="Keep on top of other windows">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 1.8 14.2 5.8 12.9 7.1 12 6.9 9.6 9.3 9.9 12.1 8.6 13.4 6 10.8 2.6 14.2 1.8 13.4 5.2 10 2.6 7.4 3.9 6.1 6.7 6.4 9.1 4 8.9 3.1Z"/></svg>
        </button>
        <button class="icon-button" id="close-button" type="button" title="Hide panel (Esc). Reopen from the tray or with the shortcut." aria-label="Hide panel">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.2 3.1 8 6.9l3.8-3.8 1.1 1.1L9.1 8l3.8 3.8-1.1 1.1L8 9.1l-3.8 3.8-1.1-1.1L6.9 8 3.1 4.2Z"/></svg>
        </button>
      </div>
    </header>

    <div class="status-bar" role="status" aria-live="polite">
      <span class="status-icon" id="status-icon" aria-hidden="true"></span>
      <span class="status-line" id="status-line">Starting…</span>
    </div>

    <div class="pin-notice hidden" id="pin-notice" role="note">
      <span>Not pinned on top: the app you type in can cover this panel.</span>
      <button class="link-button" id="pin-notice-button" type="button">Pin on top</button>
    </div>

    <div class="panel-body" id="panel-body">
      <section class="empty-state" id="empty-state">
        <p class="empty-title" id="empty-title">Start typing in any text field.</p>
        <p class="empty-detail" id="empty-detail"></p>
        <button class="secondary hidden" id="resume-button" type="button">Resume monitoring</button>
      </section>

      <section class="text-block hidden" id="source-block" aria-labelledby="source-label">
        <div class="block-label"><span id="source-label">Your text</span><span class="block-meta" id="source-meta"></span></div>
        <div class="text-view" id="source-text" tabindex="0"></div>
      </section>

      <section class="text-block suggestion-block hidden" id="suggestion-block" aria-labelledby="suggestion-label">
        <div class="block-label"><span id="suggestion-label">Suggestion</span><button class="link-button" id="edit-button" type="button" aria-pressed="false" title="Edit the suggestion before copying or applying">Edit</button></div>
        <div class="text-view" id="suggestion-text" tabindex="0"></div>
        <textarea class="hidden" id="suggestion-edit" spellcheck="true" aria-label="Edit suggestion"></textarea>
        <p class="note hidden" id="suggestion-note"></p>
        <ul class="findings hidden" id="findings" aria-label="Findings to review"></ul>
        <ul class="hints hidden" id="hints" aria-label="Clarity hints"></ul>
      </section>

      <section class="actions hidden" id="actions" aria-label="Writing actions">
        <p class="ai-hint hidden" id="ai-hint"></p>
        <div class="action-group" data-group="fix"><div class="action-group-title">Fix</div><button class="action-primary" data-action="correct" type="button"><span class="action-bullet bullet-coral" aria-hidden="true">A</span><span><b>Correct</b><small>Spelling, grammar, punctuation</small></span></button></div>
        <div class="action-group" data-group="rewrite"><div class="action-group-title">Rewrite</div><div class="action-grid-small"><button data-action="clearer" type="button" title="Rephrase to improve clarity and flow"><b>Rephrase</b><small>Improve clarity</small></button><button data-action="professional" type="button"><b>Professional</b><small>Polish the tone</small></button><button data-action="friendly" type="button"><b>Friendly</b><small>Sound more natural</small></button><button data-action="continue" type="button"><b>Continue</b><small>Finish the thought</small></button></div></div>
        <div class="action-group" data-group="reply"><div class="action-group-title">Conversation</div><button class="action-primary" data-action="reply" type="button"><span class="action-bullet bullet-blue" aria-hidden="true">R</span><span><b>Suggest a reply</b><small>Draft from the selected message</small></span></button></div>
      </section>

      <p class="inline-error" id="inline-error" role="alert"></p>
    </div>

    <footer class="panel-footer">
      <div class="action-row" id="action-row">
        <button class="secondary hidden" id="more-button" type="button" aria-expanded="false" aria-controls="actions" title="Correct, rephrase, or change the tone of this text">More actions</button>
        <button class="secondary hidden" id="cancel-button" type="button">Cancel</button>
        <button class="secondary hidden" id="retry-button" type="button">Check again</button>
        <button class="secondary hidden" id="undo-button" type="button" title="Put your original text back in the field">Undo</button>
        <button class="secondary hidden" id="copy-button" type="button" title="Copy the full suggestion">Copy</button>
        <button class="primary hidden" id="apply-button" type="button" title="Replace the text in the original field">Apply</button>
      </div>
      <div class="footer-meta"><span id="privacy-line"></span><button class="link-button" id="open-app" type="button">Settings</button></div>
    </footer>
  </main>
</body>
</html>
