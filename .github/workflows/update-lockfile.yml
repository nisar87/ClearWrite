name: Update lockfile

# Dependency changes are resolved here because the development sandbox cannot reach the npm
# registry. Editing .github/lockfile-request.json on a claude/** branch installs the listed
# packages with exact versions and commits package.json and package-lock.json back.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/lockfile-request.json']

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
      - name: Install requested packages
        shell: pwsh
        run: |
          $request = Get-Content .github/lockfile-request.json -Raw | ConvertFrom-Json
          npm install --save-exact --no-audit --no-fund @($request.install)
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
      - name: Commit lockfile
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output 'No dependency changes.'; exit 0 }
          git commit -m 'Update lockfile: .github/lockfile-request.json'
          git push origin HEAD:${{ github.ref_name }}
